<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Zlatý stín (posunutý o 2 px doprava a dolů) -->
  <g fill="#febe10" transform="translate(2, 2)">
    <rect x="8" y="6" width="4" height="20"/>
    <rect x="8" y="6" width="12" height="4"/>
    <rect x="8" y="22" width="12" height="4"/>
    <rect x="20" y="10" width="4" height="12"/>
    <rect x="16" y="10" width="4" height="4"/>
    <rect x="16" y="18" width="4" height="4"/>
  </g>

  <!-- Modré "D" navrchu -->
  <g fill="#00529f">
    <rect x="8" y="6" width="4" height="20"/>
    <rect x="8" y="6" width="12" height="4"/>
    <rect x="8" y="22" width="12" height="4"/>
    <rect x="20" y="10" width="4" height="12"/>
    <rect x="16" y="10" width="4" height="4"/>
    <rect x="16" y="18" width="4" height="4"/>
  </g>

  <!-- Malé pixelové sluníčko v pravém horním rohu -->
  <g fill="#ff6600">
    <rect x="25" y="3" width="4" height="4"/>
    <rect x="24" y="2" width="6" height="6" fill="none" stroke="#ff6600" stroke-width="1"/>
  </g>
</svg>