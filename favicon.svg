<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Tyrkysový stín (posunutý o 2 px doprava a dolů) -->
  <g fill="#2dd4bf" transform="translate(2, 2)">
    <rect x="8" y="6" width="4" height="20"/>
    <rect x="8" y="6" width="12" height="4"/>
    <rect x="8" y="22" width="12" height="4"/>
    <rect x="20" y="10" width="4" height="12"/>
    <rect x="16" y="10" width="4" height="4"/>
    <rect x="16" y="18" width="4" height="4"/>
  </g>

  <!-- Tmavě modré "D" navrchu -->
  <g fill="#1e3a8a">
    <rect x="8" y="6" width="4" height="20"/>
    <rect x="8" y="6" width="12" height="4"/>
    <rect x="8" y="22" width="12" height="4"/>
    <rect x="20" y="10" width="4" height="12"/>
    <rect x="16" y="10" width="4" height="4"/>
    <rect x="16" y="18" width="4" height="4"/>
  </g>

  <!-- Malé pixelové sluníčko v pravém horním rohu -->
  <g fill="#fde047">
    <rect x="25" y="3" width="4" height="4"/>
    <rect x="24" y="2" width="6" height="6" fill="none" stroke="#fde047" stroke-width="1"/>
  </g>
</svg>